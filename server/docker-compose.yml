# Local PostgreSQL, to try the server as in production: docker compose up -d
# then TOEIC_DATABASE_URL=postgres://toeic:toeic@localhost:5432/toeic npm run dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: toeic
      POSTGRES_PASSWORD: toeic
      POSTGRES_DB: toeic
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - toeic-db:/var/lib/postgresql/data
volumes:
  toeic-db:
